<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Login Service{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
    label { display: block; margin: .5rem 0 .2rem; }
    input { width: 100%; padding: .4rem; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    .msg { background: #f3f3f3; padding: .5rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>{% block heading %}{% endblock %}</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}<p class="msg">{{ messages|join(" ") }}</p>{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
